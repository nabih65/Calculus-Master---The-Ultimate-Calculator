<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Plotter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2f;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border: 2px solid #ccc;
      margin-top: 10px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 10px;
    }
    input[type="text"] {
      padding: 8px;
      width: 200px;
    }
    button {
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .tables {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    table {
      border-collapse: collapse;
      background-color: #2c2c3c;
    }
    th, td {
      border: 1px solid #555;
      padding: 4px 8px;
      text-align: center;
      color: #ddd;
    }
    .expression-label {
      font-weight: bold;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h1>رسم دوال رياضية</h1>
  <div class="controls">
    <span class="expression-label">F(x)=</span><input type="text" id="expression" placeholder="مثلاً: sin(x), x^2 - 3" />
    <button onclick="drawGraph()">رسم</button>
    <button onclick="clearCanvas()">مسح</button>
    <button onclick="addOperator('x')">x</button>
    <button onclick="addOperator('^')">^</button>
    <button onclick="addOperator('+')">+</button>
    <button onclick="addOperator('-')">-</button>
    <button onclick="addOperator('*')">*</button>
    <button onclick="addOperator('/')">/</button>
    <button onclick="addOperator('sqrt(')">√</button>
    <button onclick="addOperator('sin(')">sin</button>
    <button onclick="addOperator('cos(')">cos</button>
    <button onclick="addOperator('tan(')">tan</button>
    <button onclick="addOperator('(')">(</button>
    <button onclick="addOperator(')')">)</button>
  </div><canvas id="graph" width="500" height="500"></canvas>

  <div class="tables">
    <div>
      <h3>جدول التغيّرات</h3>
      <table id="changeTable"></table>
    </div>
    <div>
      <h3>جدول الإشارة</h3>
      <table id="signTable"></table>
    </div>
  </div>  <script>
    const canvas = document.getElementById('graph');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const scale = 12.5; // 25 px = 1 unit
    const originX = width / 2;
    const originY = height / 2;

    function drawAxes() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1;

      // Draw x and y axis
      ctx.beginPath();
      ctx.moveTo(0, originY);
      ctx.lineTo(width, originY);
      ctx.moveTo(originX, 0);
      ctx.lineTo(originX, height);
      ctx.stroke();

      // Ticks and labels
      ctx.fillStyle = '#888';
      for (let i = -20; i <= 20; i++) {
        ctx.beginPath();
        ctx.moveTo(originX + i * scale, originY - 4);
        ctx.lineTo(originX + i * scale, originY + 4);
        ctx.stroke();
        if (i !== 0) ctx.fillText(i, originX + i * scale - 5, originY + 15);

        ctx.beginPath();
        ctx.moveTo(originX - 4, originY - i * scale);
        ctx.lineTo(originX + 4, originY - i * scale);
        ctx.stroke();
        if (i !== 0) ctx.fillText(i, originX + 5, originY - i * scale + 5);
      }
    }

    function addOperator(op) {
      const input = document.getElementById('expression');
      input.value += op;
    }

    function parseExpression(expr) {
      return expr.replace(/\^/g, '**');
    }

    function drawGraph() {
      drawAxes();
      const expr = parseExpression(document.getElementById('expression').value);
      let f;
      try {
        f = new Function('x', `return ${expr}`);
      } catch {
        alert('خطأ في الدالة');
        return;
      }

      ctx.beginPath();
      ctx.strokeStyle = '#00ff00';
      let first = true;
      for (let x = -20; x <= 20; x += 0.1) {
        let y;
        try {
          y = f(x);
        } catch {
          continue;
        }
        if (isNaN(y) || !isFinite(y)) continue;
        const screenX = originX + x * scale;
        const screenY = originY - y * scale;
        if (first) {
          ctx.moveTo(screenX, screenY);
          first = false;
        } else {
          ctx.lineTo(screenX, screenY);
        }
      }
      ctx.stroke();

      updateTables(f);
    }

    function clearCanvas() {
      drawAxes();
      document.getElementById('changeTable').innerHTML = '';
      document.getElementById('signTable').innerHTML = '';
    }

    function updateTables(f) {
      const changeTable = document.getElementById('changeTable');
      const signTable = document.getElementById('signTable');

      changeTable.innerHTML = '<tr><th>x</th><th>f(x)</th></tr>';
      signTable.innerHTML = '<tr><th>x</th><th>إشارة f(x)</th></tr>';

      for (let x = -10; x <= 10; x++) {
        let y;
        try {
          y = f(x);
        } catch {
          continue;
        }
        const row1 = `<tr><td>${x}</td><td>${Math.round(y * 100) / 100}</td></tr>`;
        const row2 = `<tr><td>${x}</td><td>${y > 0 ? '+' : y < 0 ? '-' : '0'}</td></tr>`;
        changeTable.innerHTML += row1;
        signTable.innerHTML += row2;
      }
    }

    drawAxes();
  </script></body>
</html>
