<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>آلة حاسبة متقدمة</title>
  <style>
    body {
      background-color: #121212;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .calculator {
      background-color: #1e1e1e;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      padding: 20px;
      width: 340px;
    }

    .display {
      background-color: #000;
      color: #0f0;
      font-size: 2em;
      padding: 20px;
      border-radius: 10px;
      text-align: right;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    button {
      padding: 20px;
      font-size: 1.2em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-num {
      background-color: #2c2c2c;
      color: #fff;
    }

    .btn-op {
      background-color: #ff9800;
      color: white;
    }

    .btn-clear {
      background-color: #9e9e9e;
      color: white;
    }

    .btn-equal {
      background-color: #03a9f4;
      color: white;
      grid-column: span 4;
      font-size: 1.5em;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn-op" onclick="append('/')">÷</button>
      <button class="btn-op" onclick="append('*')">×</button>
      <button class="btn-op" onclick="append('-')">−</button>

      <button class="btn-num" onclick="append('7')">7</button>
      <button class="btn-num" onclick="append('8')">8</button>
      <button class="btn-num" onclick="append('9')">9</button>
      <button class="btn-op" onclick="append('+')">+</button>

      <button class="btn-num" onclick="append('4')">4</button>
      <button class="btn-num" onclick="append('5')">5</button>
      <button class="btn-num" onclick="append('6')">6</button>
      <div></div>

      <button class="btn-num" onclick="append('1')">1</button>
      <button class="btn-num" onclick="append('2')">2</button>
      <button class="btn-num" onclick="append('3')">3</button>
      <div></div>

      <button class="btn-num" style="grid-column: span 2;" onclick="append('0')">0</button>
      <button class="btn-num" onclick="append('.')">.</button>
      <div></div>

      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let display = document.getElementById("display");

    function append(value) {
      if (display.textContent === "0" || display.textContent === "خطأ") {
        display.textContent = value;
      } else {
        display.textContent += value;
      }
    }

    function clearDisplay() {
      display.textContent = "0";
    }

    function calculate() {
      try {
        display.textContent = eval(display.textContent);
      } catch {
        display.textContent = "خطأ";
      }
    }
  </script>
</body>
</html>
